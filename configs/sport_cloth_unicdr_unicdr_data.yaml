field_separator: "\t"
data_path: "dataset"
gpu_id: 0
use_gpu: True
show_progress: False
seed: 42
overlap_users_only: True
eval_overlap_users_only: True
seen_target_items_only: True
eval_args:
  split: {"LS": "valid_and_test"}
  split_valid: {"RS": [0.8, 0.2]}
  group_by: user
  order: TO
  mode: uni999
metrics: ["Hit", "NDCG", "Recall", "MRR"]
topk: [10]
valid_metric: NDCG@10
eval_step: 5
stopping_step: 20

# UniCDR official dual-user-intra training setup.
train_epochs: ["BOTH:100"]
paired_domain_sampling: False
learning_rate: 0.001
weight_decay: 1e-5
train_batch_size: 5120
batches_per_epoch: 500
lr_decay: 0.98
decay_epoch: 10
neg_sampling:
  uniform: 10

task: dual-user-intra
aggregator: user_attention
lambda_a: 0.5
latent_dim: 128
dropout: 0.3
lambda_loss: 0.4
maxlen: 10
eval_maxlen: 50
mask_rate: 0.1
warmup_epochs: 0

source_domain:
  dataset: AmazonSportUniCDR
  USER_ID_FIELD: user_id
  ITEM_ID_FIELD: item_id
  RATING_FIELD: rating
  TIME_FIELD: timestamp
  NEG_PREFIX: neg_
  LABEL_FIELD: label
  user_inter_num_interval: ~
  item_inter_num_interval: ~
  load_col:
    inter: [user_id, item_id, rating, timestamp]
target_domain:
  dataset: AmazonClothUniCDR
  benchmark_filename: ["train", "valid", "test"]
  USER_ID_FIELD: user_id
  ITEM_ID_FIELD: item_id
  RATING_FIELD: rating
  TIME_FIELD: timestamp
  NEG_PREFIX: neg_
  LABEL_FIELD: label
  user_inter_num_interval: ~
  item_inter_num_interval: ~
  load_col:
    inter: [user_id, item_id, rating, timestamp]
